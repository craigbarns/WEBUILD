<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <!-- Fond blanc -->
  <rect width="1200" height="1200" fill="#FFFFFF"/>
  
  <!-- Groupe centré et plus petit pour éviter d'être coupé (Safe Zone circulaire) -->
  <g transform="translate(320, 600)">
    <!-- Carré jaune (la "mark") -->
    <rect x="0" y="-45" width="60" height="60" fill="#E2B10A"/>
    
    <!-- Texte WEBUILD -->
    <text x="90" y="10" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="120" letter-spacing="-4" fill="#161412">WEBUILD</text>
  </g>
</svg>
